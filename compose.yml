# Local development deployment. Linux containers (Docker Desktop + WSL2 on Windows).
#
#   docker compose up -d warehouse                     # PostgreSQL only (CLI / tests / CI parity)
#   docker compose --profile airflow up -d --build     # + Airflow 3 (LocalExecutor, separate metadata DB)
#   docker compose --profile airflow down              # stop; add -v to discard volumes
#
# Images are pinned by tag AND digest; see requirements/images.lock.
name: cohortwarehouse

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: cohortwarehouse-airflow:local
  env_file: [.env]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set in .env}@airflow-db:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Warehouse credentials are exposed to tasks as Airflow Connections (env-backed secrets backend).
    AIRFLOW_CONN_CW_LOADER: postgresql://${CW_LOADER_USER}:${CW_LOADER_PASSWORD}@warehouse:5432/${CW_PG_DATABASE}
    AIRFLOW_CONN_CW_TRANSFORMER: postgresql://${CW_TRANSFORMER_USER}:${CW_TRANSFORMER_PASSWORD}@warehouse:5432/${CW_PG_DATABASE}
    AIRFLOW_CONN_CW_PUBLISHER: postgresql://${CW_PUBLISHER_USER}:${CW_PUBLISHER_PASSWORD}@warehouse:5432/${CW_PG_DATABASE}
    CW_PG_HOST: warehouse
    CW_PG_PORT: "5432"
    CW_DBT_EXECUTABLE: /opt/dbt-venv/bin/dbt
    CW_REPO_ROOT: /opt/cohortwarehouse
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/cohortwarehouse/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  warehouse:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_DB: ${CW_PG_DATABASE:-cohortwarehouse}
      POSTGRES_USER: ${CW_ADMIN_USER:-cw_admin}
      POSTGRES_PASSWORD: ${CW_ADMIN_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_statement=ddl
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=96MB
      # Index builds on the million-row event models dominate a full refresh; 64MB forces repeated spills.
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_wal_size=2GB
    ports:
      - "127.0.0.1:${CW_PG_PORT:-5433}:5432"   # localhost only
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-db:
    profiles: [airflow]
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set in .env}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    profiles: [airflow]
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    profiles: [airflow]
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    profiles: [airflow]
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    profiles: [airflow]
    command: dag-processor
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    profiles: [airflow]
    command: triggerer
    restart: unless-stopped

volumes:
  warehouse-data:
  airflow-db-data:
