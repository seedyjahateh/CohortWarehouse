name: ci

# PR pipeline (PRD Section 12.1). No production credentials, no external patient data. Warehouse passwords
# are generated per job and exist only inside the ephemeral runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  POSTGRES_IMAGE: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74

jobs:
  static:
    name: locks, lint, unit tests, secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "requirements/*.lock"}
      - name: Install pinned dependencies
        run: pip install -r requirements/dbt.lock -r requirements/dev.lock
      - name: Validate locks and image pins
        run: |
          grep -E '^dbt-core==[0-9.]+$' requirements/dbt.lock
          grep -E '^dbt-postgres==[0-9.]+$' requirements/dbt.lock
          if grep -nE 'image:\s*[^ ]+$' compose.yml | grep -v '@sha256:' | grep -v 'cohortwarehouse-airflow'; then
            echo "unpinned image in compose.yml"; exit 1; fi
      - name: Validate Compose configuration
        run: cp .env.example .env && sed -i 's/CHANGE_ME/placeholder/' .env && docker compose --profile airflow config -q && rm .env
      - name: Ruff
        run: ruff check .
      - name: Unit tests (parsing, canonical keys, manifests, contracts, docs coverage)
        run: pytest tests/unit -q --junitxml=artifacts/junit-unit.xml
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source /repo --no-banner --redact -v
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: unit-results, path: artifacts/junit-unit.xml}

  warehouse:
    name: fixture warehouse (FICTIONAL test vocabulary)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "requirements/*.lock"}
      - run: pip install -r requirements/dbt.lock -r requirements/dev.lock
      - name: Generate ephemeral credentials
        run: |
          for role in ADMIN LOADER TRANSFORMER PUBLISHER BI_READER OMOP_READER; do
            value=$(openssl rand -hex 16); echo "::add-mask::$value"; echo "CW_${role}_PASSWORD=$value" >> "$GITHUB_ENV"
          done
          cat .env.example | grep -E '^CW_(PG|[A-Z_]+_USER)' >> "$GITHUB_ENV"
          echo "CW_PG_PORT=5433" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL 16
        run: |
          docker run -d --name warehouse -p 127.0.0.1:5433:5432 \
            -e POSTGRES_DB=cohortwarehouse -e POSTGRES_USER=cw_admin -e POSTGRES_PASSWORD="$CW_ADMIN_PASSWORD" \
            "$POSTGRES_IMAGE" postgres -c timezone=UTC
          for i in $(seq 1 30); do docker exec warehouse pg_isready -U cw_admin && break; sleep 2; done
      - name: Bootstrap schemas, roles and fictional vocabulary
        run: |
          python -m cohortwarehouse bootstrap
          python -m cohortwarehouse load-vocabulary tests/fixtures/vocabulary --license-note "FICTIONAL CI vocabulary"
      - name: dbt debug and parse
        env: {CW_RUN_ID: ci-parse}
        run: |
          dbt debug --project-dir dbt --profiles-dir dbt
          dbt parse --project-dir dbt --profiles-dir dbt
      - name: Loader contract, lifecycle, reconciliation, role-denial, replay and incremental-vs-full tests
        env: {CW_TEST_DISPOSABLE_DB: "1"}
        run: pytest tests/integration -v --junitxml=artifacts/junit-integration.xml
      - name: Generate dbt docs
        if: success()
        env: {CW_RUN_ID: ci-docs}
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --target-path target/docs
      - name: Upload evidence (no raw payloads, no restricted vocabularies)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warehouse-evidence-fictional-vocabulary
          path: |
            artifacts/junit-integration.xml
            dbt/target/runs/**/run_results.json
            dbt/target/runs/**/dbt_stdout.log
            dbt/target/docs/manifest.json
            dbt/target/docs/catalog.json
            dbt/target/docs/index.html

  airflow:
    name: DAG parse and structure (pinned Airflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==3.1.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt"
          pip install --no-deps -e . && pip install "psycopg[binary]" PyYAML jsonschema pytest
      - name: DAG tests
        env: {AIRFLOW__CORE__LOAD_EXAMPLES: "false", AIRFLOW__CORE__DAGS_FOLDER: "${{ github.workspace }}/dags"}
        run: |
          airflow db migrate
          pytest tests/airflow -v
