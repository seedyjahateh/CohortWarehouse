# Release benchmark generation (ING-01). Every value here is recorded in the manifest.
dataset_id: synthea_demo
generator:
  name: synthea
  version: v3.3.0
  # Download https://github.com/synthetichealth/synthea/releases/download/v3.3.0/synthea-with-dependencies.jar
  # and record its SHA-256 below after the first verified download.
  jar_path: tools/synthea-with-dependencies.jar
  jar_sha256: 8ba04f7d73abadd5a377e41edf24c5c83935a1cb07c6d982cd5db731ef1cf445
  # Java runs in a pinned container so no host JDK is required. mode: docker | host
  runtime:
    mode: docker
    image: eclipse-temurin:17.0.16_8-jre-jammy@sha256:e90fd2b084488c0ffdd22610d44c1579e63b585c7fb83489fd815c0dc5b4e1f7
    max_heap: 3g
    container_memory: 4g
  seed: 20260915
  clinician_seed: 20260915
  requested_population: 1000
  location: Massachusetts
  simulation_end_date: 2026-06-30
  # Exporter settings passed as --key=value overrides (hashed into config_sha256).
  properties:
    exporter.csv.export: "true"
    exporter.fhir.export: "false"
    exporter.hospital.fhir.export: "false"
    exporter.practitioner.fhir.export: "false"
    exporter.ccda.export: "false"
    exporter.baseDirectory: "{output_dir}"
    exporter.years_of_history: "10"
    generate.only_alive_patients: "false"
output_root: data/deliveries/synthea_demo
delivery:
  kind: frozen_demo
  source_revision: 1
  replacement_mode: full
