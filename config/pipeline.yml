# Operational policy (NFR-04, NFR-05, Section 10 retention, Section 8.6 coverage).
freshness:
  # scheduled: measure now - latest valid delivery.
  # frozen_demo: a labelled demo mode; freshness is assessed against the declared
  #              one-off delivery, and results say "frozen demo" rather than "fresh".
  mode: frozen_demo
  warn_after_hours: 26
  error_after_hours: 48
schedule:
  cron: "15 5 * * *"
  timezone: UTC
  manifest_due_utc: "05:00"
  delivery_deadline_utc: "06:00"
coverage:
  cohort_codes_min_pct: 100.0
  category_event_weighted_min_pct: 95.0
  # Input categories = source files (docs/omop-scope.md explains why observations.csv, which feeds both
  # MEASUREMENT and OBSERVATION, is assessed as one category).
  categories: [conditions, medications, observations]
retention:
  raw_and_quarantine_days: 30
  audit_metadata_days: 90
  keep_releases: [current, previous, report_pinned]
validation_profiles:
  fixture:
    allow_test_vocabulary: true
    # A fictional vocabulary maps only a handful of codes, so coverage percentages measure the test
    # package, not the ETL. They are still computed and recorded, but as warnings: a run on a test
    # vocabulary can exercise and measure the full path including publication. The release profile below
    # is the only one that can certify a release, and it refuses a test-only vocabulary outright.
    coverage_severity: warning
    label: "Fixture validation with FICTIONAL test-only vocabulary (coverage not assessable)"
  release:
    allow_test_vocabulary: false
    coverage_severity: blocking
    label: "Release validation with pinned OMOP vocabulary"
